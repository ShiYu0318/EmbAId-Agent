name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # pgvector so the Postgres search tests run instead of being skipped
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: embaid
          POSTGRES_PASSWORD: embaid
          POSTGRES_DB: embaid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U embaid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://embaid:embaid@localhost:5432/embaid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # qdrant and bedrock so their backend and provider tests run too
      - run: uv sync --extra dev --extra qdrant --extra bedrock
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
