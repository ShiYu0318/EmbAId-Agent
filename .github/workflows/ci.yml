name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # pgvector so the Postgres search tests run instead of being skipped
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: embaid
          POSTGRES_PASSWORD: embaid
          POSTGRES_DB: embaid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U embaid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # a real Redis so the shared rate limiter's script runs on a server, not only a fake
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://embaid:embaid@localhost:5432/embaid
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # qdrant and bedrock so their backend and provider tests run too
      # --frozen: test exactly what uv.lock pins, and fail if the lockfile is out of date
      - run: uv sync --frozen --extra dev --extra qdrant --extra bedrock
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q -rs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node apps/landing/build.mjs
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/api.Dockerfile -t embaid-api .
      - run: docker build -f docker/dashboard.Dockerfile -t embaid-dashboard .
      # Both images must run as an unprivileged user, and the API's environment must load.
      - run: test "$(docker run --rm embaid-api id -u)" != "0"
      - run: test "$(docker run --rm embaid-dashboard id -u)" != "0"
      - run: docker run --rm embaid-api uv run --no-sync python -c "import fastapi, redis, src.config"
