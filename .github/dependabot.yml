version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # jsdom 27 and later need a newer Node than the Node 20 this repository supports.
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      # TypeScript 7 drops the JavaScript compiler API. typescript-eslint and tsup's
      # declaration build still need it, so the major waits until they support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node follows the newest Node that CI tests (22). A newer major would type-check
      # APIs that do not exist at runtime on the supported Node versions.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
