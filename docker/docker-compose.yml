name: embaid-agent

# Full stack: API + background worker + dashboard, with Postgres (pgvector) and Redis.
#   cp apps/api/.env.example apps/api/.env   # set JWT_SECRET and your models
#   docker compose -f docker/docker-compose.yml up --build
# Ports can be moved if they are taken: POSTGRES_PORT=5433 REDIS_PORT=6380 docker compose ...
# Postgres, Redis, Qdrant and Ollama are published on 127.0.0.1 only: they use default
# credentials or none, so they must not be reachable from the network.
# When the API is reachable at a public URL, build the dashboard against it:
#   PUBLIC_API_URL=https://api.example.com docker compose ... up --build

x-api: &api
  build:
    context: ..
    dockerfile: docker/api.Dockerfile
    args:
      # e.g. UV_EXTRAS="--extra bedrock --extra rerank" docker compose ... up --build
      UV_EXTRAS: ${UV_EXTRAS:-}
  env_file:
    - ../apps/api/.env
  environment:
    DATABASE_URL: postgresql+asyncpg://embaid:embaid@postgres:5432/embaid
    # postgres (pgvector in the same database) by default; or SEARCH_BACKEND=qdrant with
    # --profile qdrant and UV_EXTRAS="--extra qdrant"
    SEARCH_BACKEND: ${SEARCH_BACKEND:-postgres}
    QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    QUEUE_ENABLED: "true"
    REDIS_URL: redis://redis:6379
    # Count rate limits in Redis so they hold across API replicas.
    RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
    # Uploaded files live on a volume shared by the API and the worker. Set
    # STORAGE_ENDPOINT_URL / STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY in .env to use S3 instead.
    # Ollama on your machine by default; with --profile ollama use http://ollama:11434.
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - app_data:/app/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  api:
    <<: *api
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *api
    command: ["uv", "run", "--no-sync", "arq", "src.tasks.worker.WorkerSettings"]

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
      args:
        # The browser calls this URL, so it is the API as seen from your machine.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: embaid
      POSTGRES_PASSWORD: embaid
      POSTGRES_DB: embaid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embaid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  app_data:
  postgres_data:
  ollama_data:
  qdrant_data:
