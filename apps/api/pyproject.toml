[project]
name = "embaid-api"
version = "0.1.0"
description = "EmbAId Chat API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "arq>=0.26",
    "redis>=5.2",
    "boto3>=1.35",
    "langchain-core>=0.3.29",
    "langchain-text-splitters>=0.3.5",
    "langchain-anthropic>=0.3.1",
    "langchain-openai>=0.3",
    "langchain-ollama>=0.2.2",
    "numpy>=2.2",
    "faiss-cpu>=1.9",
    "pypdf>=5.1",
    "docx2txt>=0.8",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "opencc-python-reimplemented>=0.1.7",
    "jieba>=0.42",
    "sentry-sdk[fastapi]>=2.20",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.3"]
crawl = ["playwright>=1.49"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
ignore_missing_imports = true
